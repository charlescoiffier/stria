<script>
'use strict';
/* ====================== Fonctions pures (testables) ====================== */
/* @core-start */

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

// Interpolation bilinéaire d'une carte Float32 (W×H), coordonnées en pixels (centre pixel = +0.5).
function sampleBilinear(map, W, H, x, y) {
  x = clamp(x - 0.5, 0, W - 1); y = clamp(y - 0.5, 0, H - 1);
  const x0 = x | 0, y0 = y | 0, x1 = Math.min(x0 + 1, W - 1), y1 = Math.min(y0 + 1, H - 1);
  const fx = x - x0, fy = y - y0;
  const a = map[y0 * W + x0], b = map[y0 * W + x1], c = map[y1 * W + x0], d = map[y1 * W + x1];
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}

// Flou gaussien approché (3 passes de boîte), séparable, bords répliqués.
function gaussBlur(src, W, H, sigma) {
  if (sigma < 0.5) return src;
  const r = Math.max(1, Math.round((Math.sqrt(12 * sigma * sigma / 3 + 1) - 1) / 2));
  let a = Float32Array.from(src), b = new Float32Array(src.length);
  const n = 2 * r + 1;
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < H; y++) {           // horizontal a -> b
      const o = y * W; let s = a[o] * r;
      for (let i = 0; i <= r; i++) s += a[o + Math.min(i, W - 1)];
      for (let x = 0; x < W; x++) {
        b[o + x] = s / n;
        s += a[o + Math.min(x + r + 1, W - 1)] - a[o + Math.max(x - r, 0)];
      }
    }
    for (let x = 0; x < W; x++) {           // vertical b -> a
      let s = b[x] * r;
      for (let i = 0; i <= r; i++) s += b[Math.min(i, H - 1) * W + x];
      for (let y = 0; y < H; y++) {
        a[y * W + x] = s / n;
        s += b[Math.min(y + r + 1, H - 1) * W + x] - b[Math.max(y - r, 0) * W + x];
      }
    }
  }
  return a;
}

// Lissage gaussien 1D (sigma en échantillons), bords répliqués.
function smooth1D(w, sigma) {
  if (sigma < 0.3) return w;
  const R = Math.ceil(3 * sigma), k = new Float32Array(2 * R + 1);
  let sum = 0;
  for (let i = -R; i <= R; i++) sum += (k[i + R] = Math.exp(-i * i / (2 * sigma * sigma)));
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  const out = new Float32Array(w.length), n = w.length;
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = -R; j <= R; j++) s += w[clamp(i + j, 0, n - 1)] * k[j + R];
    out[i] = s;
  }
  return out;
}

// Douglas-Peucker sur (s, w) pour i ∈ [lo, hi] ; retourne la liste triée des indices conservés.
function simplifyProfile(s, w, lo, hi, tol) {
  const keep = [lo, hi], stack = [[lo, hi]];
  while (stack.length) {
    const [a, b] = stack.pop();
    if (b - a < 2) continue;
    let dmax = 0, im = -1;
    const ds = s[b] - s[a];
    for (let i = a + 1; i < b; i++) {
      const wi = w[a] + (w[b] - w[a]) * ((s[i] - s[a]) / ds);
      const d = Math.abs(w[i] - wi);
      if (d > dmax) { dmax = d; im = i; }
    }
    if (dmax > tol) { keep.push(im); stack.push([a, im], [im, b]); }
  }
  return keep.sort((u, v) => u - v);
}

// Intervalle de s où o + d·s reste dans [lo,hi] ; intersecte [s0,s1].
function clipRange(o, d, lo, hi, rng) {
  if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) { rng[1] = rng[0] - 1; } return; }
  let t1 = (lo - o) / d, t2 = (hi - o) / d;
  if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
  rng[0] = Math.max(rng[0], t1); rng[1] = Math.min(rng[1], t2);
}

// Sutherland–Hodgman : garde la partie d'un polygone (tableau plat [x0,y0,x1,y1,…]) du bon côté d'une droite x = bound
// (axis 0) ou y = bound (axis 1). Les points d'intersection sont posés exactement sur la droite.
function clipHalf(poly, axis, bound, keepGreater) {
  const out = [], n = poly.length / 2;
  if (!n) return out;
  const inside = c => (keepGreater ? c >= bound : c <= bound);
  let px = poly[2 * n - 2], py = poly[2 * n - 1], pc = axis ? py : px, pin = inside(pc);
  for (let i = 0; i < n; i++) {
    const x = poly[2 * i], y = poly[2 * i + 1], c = axis ? y : x, cin = inside(c);
    if (cin !== pin) {
      const t = (bound - pc) / (c - pc);
      if (axis) out.push(px + (x - px) * t, bound); else out.push(bound, py + (y - py) * t);
    }
    if (cin) out.push(x, y);
    px = x; py = y; pc = c; pin = cin;
  }
  return out;
}

// Découpe un polygone au rectangle [0,W]×[0,H] ; null s'il n'en reste rien.
function clipPolygonRect(pts, W, H) {
  let inside = true;
  for (let i = 0; i < pts.length; i += 2) {
    if (pts[i] < 0 || pts[i] > W || pts[i + 1] < 0 || pts[i + 1] > H) { inside = false; break; }
  }
  if (inside) return pts;
  let poly = Array.from(pts);
  poly = clipHalf(poly, 0, 0, true); poly = clipHalf(poly, 0, W, false);
  poly = clipHalf(poly, 1, 0, true); poly = clipHalf(poly, 1, H, false);
  return poly.length < 6 ? null : Float32Array.from(poly);
}

/*
 * Construit les rubans. `cov` = carte de couverture (0 = blanc, 1 = noir), W×H.
 * P : { spacing, angle(deg), wmin, wmax (ou mapW : couverture → épaisseur px), cut (px), step (px), smooth (échantillons), tol (px) }
 * Les rubans débordent d'abord du cadre, puis sont découpés exactement sur son contour : leurs extrémités
 * s'alignent sur les bords de l'image, quel que soit l'angle.
 * Retour : [{ k, pts: Float32Array [x0,y0,x1,y1,…] }]  (polygone fermé : bord +, puis bord − inversé)
 */
function buildRibbons(cov, W, H, P) {
  const p = P.spacing, th = P.angle * Math.PI / 180;
  const dx = Math.cos(th), dy = Math.sin(th), nx = -dy, ny = dx;
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2;
  const kmax = Math.ceil(R / p);
  const mg = 0.75 * Math.max(p, P.wmax || 0);        // débord : le ruban doit dépasser le cadre sur toute sa largeur
  const taps = [-0.4, -0.2, 0, 0.2, 0.4], tw = [1, 2, 3, 2, 1], twSum = 9;
  const out = [];
  for (let k = -kmax; k <= kmax; k++) {
    const v = k * p, ox = cx + nx * v, oy = cy + ny * v;
    const rng = [-R, R];
    clipRange(ox, dx, -mg, W + mg, rng); clipRange(oy, dy, -mg, H + mg, rng);
    const len = rng[1] - rng[0];
    if (len < P.step) continue;
    const n = Math.ceil(len / P.step) + 1;
    const s = new Float32Array(n), w = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const si = rng[0] + len * i / (n - 1);
      s[i] = si;
      const x = ox + dx * si, y = oy + dy * si;
      let c = 0;
      for (let j = 0; j < taps.length; j++) {
        const u = taps[j] * p;
        c += tw[j] * sampleBilinear(cov, W, H, x + nx * u, y + ny * u);
      }
      w[i] = c / twSum;
    }
    const ws = smooth1D(w, P.smooth);
    for (let i = 0; i < n; i++) ws[i] = P.mapW ? P.mapW(clamp(ws[i], 0, 1)) : P.wmin + (P.wmax - P.wmin) * clamp(ws[i], 0, 1);
    // tronçons où l'épaisseur dépasse le seuil de coupure (jamais de ruban d'épaisseur nulle)
    const cut = Math.max(P.cut, 1e-3);
    let i = 0;
    while (i < n) {
      while (i < n && ws[i] < cut) i++;
      let j = i;
      while (j < n && ws[j] >= cut) j++;
      if (j - i >= 2) {
        const idx = simplifyProfile(s, ws, i, j - 1, P.tol), m = idx.length;
        const pts = new Float32Array(4 * m);
        for (let q = 0; q < m; q++) {
          const si = s[idx[q]], h = ws[idx[q]] / 2;
          const bx = ox + dx * si, by = oy + dy * si;
          pts[2 * q] = bx + nx * h; pts[2 * q + 1] = by + ny * h;
          const r = 2 * m + 2 * (m - 1 - q);
          pts[r] = bx - nx * h; pts[r + 1] = by - ny * h;
        }
        const clipped = clipPolygonRect(pts, W, H);
        if (clipped) out.push({ k, pts: clipped });
      }
      i = j;
    }
  }
  return out;
}

/* ---------- Styles de trame supplémentaires ---------- */

// PRNG déterministe : une même graine redonne exactement le même semis de points.
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/*
 * Trame de points (demi-teinte AM) : points sur un réseau régulier tourné de `angle`, diamètre variable.
 * P : { spacing, angle(deg), layout: 'square' | 'hex' (quinconce), dmin, dmax (px, diamètres), cut (px, diamètre minimal tracé) }
 * Le diamètre suit la racine de la couverture : la surface encrée est proportionnelle à la tonalité.
 * Retour : Float32Array [x0, y0, r0, x1, y1, r1, …]
 */
function buildDots(cov, W, H, P) {
  const p = P.spacing, th = P.angle * Math.PI / 180;
  const dx = Math.cos(th), dy = Math.sin(th), nx = -dy, ny = dx;
  const hex = P.layout === 'hex', rowStep = hex ? p * Math.sqrt(3) / 2 : p;
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2 + p;
  const jm = Math.ceil(R / rowStep), im = Math.ceil(R / p) + 1, minD = Math.max(P.cut, 0.05);
  const out = [];
  for (let j = -jm; j <= jm; j++) {
    const off = hex && (j & 1) ? p / 2 : 0;
    for (let i = -im; i <= im; i++) {
      const u = i * p + off, v = j * rowStep;
      const x = cx + dx * u + nx * v, y = cy + dy * u + ny * v;
      if (x < -p || x > W + p || y < -p || y > H + p) continue;
      const t = clamp(sampleBilinear(cov, W, H, x, y), 0, 1);
      const d = P.dmin + (P.dmax - P.dmin) * Math.sqrt(t);
      if (d < minD) continue;
      const r = d / 2;
      if (x < -r || x > W + r || y < -r || y > H + r) continue;
      out.push(x, y, r);
    }
  }
  return Float32Array.from(out);
}

/*
 * Trame stochastique : points de même diamètre, densité proportionnelle à la couverture.
 * Disques de Poisson à rayon variable (Bridson) : la distance minimale entre points vaut K·d/√couverture,
 * de sorte que le nombre de points par unité de surface suit la tonalité (bruit bleu, sans alignement).
 * P : { dot (px, diamètre), cut (couverture minimale 0..1), seed, maxPoints }
 * Retour : Float32Array [x, y, r, …]
 */
function stochasticDots(cov, W, H, P) {
  const d = P.dot, K = 0.7, cut = Math.max(P.cut, 0.005), rnd = mulberry32(P.seed | 0);
  const maxN = P.maxPoints || 400000, rmin = d * K, cs = rmin / Math.SQRT2;
  const gw = Math.ceil(W / cs) + 1, gh = Math.ceil(H / cs) + 1;
  const grid = new Int32Array(gw * gh).fill(-1);     // un point au plus par cellule (diagonale = rmin)
  const xs = [], ys = [], act = [];
  const dens = (x, y) => Math.min(1, sampleBilinear(cov, W, H, x, y));
  const rad = c => rmin / Math.sqrt(c);
  const free = (x, y, r) => {
    const gx = (x / cs) | 0, gy = (y / cs) | 0, R = Math.ceil(r / cs), r2 = r * r;
    for (let j = Math.max(0, gy - R); j <= Math.min(gh - 1, gy + R); j++) {
      for (let i = Math.max(0, gx - R); i <= Math.min(gw - 1, gx + R); i++) {
        const id = grid[j * gw + i];
        if (id >= 0) { const ex = xs[id] - x, ey = ys[id] - y; if (ex * ex + ey * ey < r2) return false; }
      }
    }
    return true;
  };
  const add = (x, y) => {
    const id = xs.length; xs.push(x); ys.push(y); act.push(id);
    grid[((y / cs) | 0) * gw + ((x / cs) | 0)] = id;
  };
  // Germes répartis dans toute l'image (les zones sombres séparées par du blanc ne se rejoignent pas toutes seules).
  for (let n = 0; n < 4000; n++) {
    const x = rnd() * W, y = rnd() * H, c = dens(x, y);
    if (c >= cut && rnd() <= c && free(x, y, rad(c))) add(x, y);
  }
  while (act.length && xs.length < maxN) {
    const ai = (rnd() * act.length) | 0, id = act[ai], px = xs[id], py = ys[id];
    const rp = rad(Math.max(dens(px, py), cut));
    let found = false;
    for (let k = 0; k < 20; k++) {
      const a = rnd() * 2 * Math.PI, rr = rp * (1 + rnd());
      const x = px + Math.cos(a) * rr, y = py + Math.sin(a) * rr;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const c = dens(x, y);
      if (c < cut) continue;
      if (free(x, y, rad(c))) { add(x, y); found = true; }
    }
    if (!found) { act[ai] = act[act.length - 1]; act.pop(); }
  }
  const out = new Float32Array(xs.length * 3);
  for (let i = 0; i < xs.length; i++) { out[3 * i] = xs[i]; out[3 * i + 1] = ys[i]; out[3 * i + 2] = d / 2; }
  return out;
}

/*
 * Hachures croisées : `n` passes de lignes parallèles, d'angles répartis sur 180°, ajoutées l'une après l'autre.
 * La passe i prend en charge la part de tonalité que les précédentes (saturées à `amax`) n'ont pas couverte :
 * avec des recouvrements indépendants, la couverture totale vaut 1 − Π(1 − aᵢ) et reproduit donc la tonalité.
 * Retourne la couverture (0..1) de chaque passe pour une tonalité c.
 */
function hatchCoverages(c, n, amax) {
  const a = new Array(n);
  let keep = 1;                                      // part de blanc restant après les passes déjà posées
  for (let i = 0; i < n; i++) {
    a[i] = clamp(1 - (1 - c) / keep, 0, amax);
    keep *= 1 - a[i];
  }
  return a;
}

// Angles (relatifs) des passes : 2 → 0/90, 3 → 0/60/120, 4 → 0/90/45/135 (les plus contrastés d'abord).
function hatchAngles(n) {
  const order = n === 4 ? [0, 2, 1, 3] : [0, 1, 2, 3].slice(0, n);
  return order.map(i => i * 180 / n);
}

/*
 * P : { spacing, angle(deg), passes, amax (couverture max d'une passe, 0..1), cut (px), step, smooth, tol }
 * Retour : rubans [{ k, layer, pts }] de toutes les passes.
 */
function buildHatch(cov, W, H, P) {
  const out = [], n = P.passes, LUT = 1024;
  hatchAngles(n).forEach((a, layer) => {
    const lut = new Float32Array(LUT + 1);
    for (let q = 0; q <= LUT; q++) lut[q] = hatchCoverages(q / LUT, n, P.amax)[layer] * P.spacing;
    const mapW = c => lut[Math.round(c * LUT)];
    for (const r of buildRibbons(cov, W, H, { ...P, angle: P.angle + a, mapW })) { r.layer = layer; out.push(r); }
  });
  return out;
}

/* @core-end */

/* ====================== Pipeline image ====================== */

const MAXDIM = 1800;
let W = 0, H = 0, baseGray = null, lo = 0, hi = 1;  // gris perceptuel de l'image source

function setImageFromCanvas(c) {
  const ctx = c.getContext('2d'), d = ctx.getImageData(0, 0, c.width, c.height).data;
  W = c.width; H = c.height;
  baseGray = new Float32Array(W * H);
  const hist = new Uint32Array(256);
  for (let i = 0; i < W * H; i++) {
    const a = d[4 * i + 3] / 255;                          // transparence → fond blanc
    const r = d[4 * i] * a + 255 * (1 - a), g = d[4 * i + 1] * a + 255 * (1 - a), b = d[4 * i + 2] * a + 255 * (1 - a);
    const L = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    baseGray[i] = L; hist[Math.round(L * 255)]++;
  }
  const total = W * H; let acc = 0; lo = 0; hi = 1;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= total * 0.01) { lo = i / 255; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= total * 0.01) { hi = i / 255; break; } }
  if (hi - lo < 0.05) { lo = 0; hi = 1; }
  const sp = Math.max(3, Math.round(Math.max(W, H) / 220));
  ui.spacing.set(sp);
  schedule();
}

function loadFile(file) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, MAXDIM / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    setImageFromCanvas(c);
  };
  img.src = URL.createObjectURL(file);
}

function demoImage() {   // sphère éclairée + dégradé, pour avoir un résultat sans fichier
  const c = document.createElement('canvas'); c.width = 1200; c.height = 800;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 1200, 0); bg.addColorStop(0, '#ddd'); bg.addColorStop(1, '#444');
  g.fillStyle = bg; g.fillRect(0, 0, 1200, 800);
  const r = g.createRadialGradient(480, 300, 40, 560, 400, 300);
  r.addColorStop(0, '#fff'); r.addColorStop(0.6, '#777'); r.addColorStop(1, '#111');
  g.fillStyle = r; g.beginPath(); g.arc(560, 400, 300, 0, 7); g.fill();
  g.fillStyle = '#000'; g.fillRect(900, 500, 200, 200);
  return c;
}

/* ====================== UI ====================== */

    ribbons:'rubans', vertices:'sommets', dotsn:'points',
    style:'Style de trame', st_lines:'Lignes parallèles', st_dots:'Points (trame régulière)',
    st_stochastic:'Points (trame stochastique)', st_hatch:'Hachures croisées',

    angle:'Angle', spacing:'Espacement', wmin:'Épaisseur min', wmax:'Épaisseur max', cut:'Seuil de coupure',
    wmin_dots:'Diamètre min', wmax_dots:'Diamètre max', cut_dots:'Diamètre min visible',

    mmhint:'Physical size of the SVG file for printing. Empty = size in pixels.',

    st_stochastic:'Dots (stochastic screen)', st_hatch:'Cross-hatching',
    layout:'Dot layout', lay_square:'Square', lay_hex:'Staggered',
    angle:'Angle', spacing:'Spacing', wmin:'Min thickness', wmax:'Max thickness', cut:'Cut-off threshold',
    wmin_dots:'Min diameter', wmax_dots:'Max diameter', cut_dots:'Min visible diameter',
    wmax_hatch:'Max thickness per pass', cut_stochastic:'Density threshold',

};
let lang = 'fr';
try { if (localStorage.getItem('stria-lang') === 'en') lang = 'en'; } catch (e) {}
const T = k => I18N[lang][k];
const sliderRefresh = [];

const ui = {};
let style = 'lines';
const $ = id => document.getElementById(id);
const sliderRows = [];
const unitPct = () => style === 'stochastic' ? ' %' : ' ' + T('sp');
function slider(host, id, min, max, step, val, fmt, styles) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label><span></span><b></b></label><input type="range">`;
  const inp = row.querySelector('input'), out = row.querySelector('b'), lab = row.querySelector('span');
  Object.assign(inp, { min, max, step, value: val });
  const upd = () => { out.textContent = fmt ? fmt(+inp.value) : inp.value; };
  const labelKey = () => (I18N[lang][id + '_' + style] ? id + '_' + style : id);
  const refresh = () => { lab.textContent = T(labelKey()); row.hidden = !!styles && !styles.includes(style); upd(); };
  sliderRefresh.push(refresh);
  inp.addEventListener('input', () => { upd(); schedule(); });
  host.appendChild(row);
  ui[id] = { get: () => +inp.value, set: v => { inp.value = v; upd(); } };
}
const LINES = 'lines', DOTS = 'dots', STO = 'stochastic', HATCH = 'hatch';
const s1 = document.getElementById('sliders'), s2 = document.getElementById('sliders2');
slider(s1, 'angle', 0, 179, 1, 45, v => v + '°', [LINES, DOTS, HATCH]);
slider(s1, 'spacing', 2, 60, 0.5, 8, v => v + ' px', [LINES, DOTS, HATCH]);
slider(s1, 'passes', 2, 4, 1, 3, v => v, [HATCH]);
slider(s1, 'dot', 1, 10, 0.1, 2.5, v => v.toFixed(1) + ' px', [STO]);
slider(s1, 'seed', 1, 99, 1, 1, v => v, [STO]);
slider(s1, 'wmin', 0, 50, 0.5, 2, v => v + ' ' + T('sp'), [LINES, DOTS]);
slider(s1, 'wmax', 20, 150, 1, 95, v => v + ' ' + T('sp'), [LINES, DOTS, HATCH]);
slider(s1, 'cut', 0, 30, 0.5, 0, v => v + unitPct());
slider(s1, 'contrast', 0.2, 3, 0.05, 1, v => v.toFixed(2));
slider(s1, 'bright', -0.5, 0.5, 0.01, 0, v => v.toFixed(2));
slider(s1, 'gamma', 0.3, 3, 0.05, 1, v => v.toFixed(2));
slider(s1, 'detail', 0, 150, 5, 30, v => v + ' ' + T('sp'));
slider(s2, 'far', 0, 12, 0.5, 0, v => v + ' px');
slider(s2, 'scale', 1, 6, 1, 3, v => '×' + v);

// Réglages par défaut propres à chaque style (appliqués quand on change de style).
const STYLE_DEFAULTS = {
  lines: { wmin: 2, wmax: 95, cut: 0, detail: 30 },
  dots: { wmin: 0, wmax: 120, cut: 4, detail: 35 },
  hatch: { wmax: 55, cut: 1, detail: 30 },
  stochastic: { cut: 2, detail: 30 },
};
$('style').addEventListener('change', e => {
  style = e.target.value;
  for (const [k, v] of Object.entries(STYLE_DEFAULTS[style])) ui[k].set(v);
  if (style === 'dots') dotsMaxDefault();
  applyLang();
  schedule();
});
// Diamètre max par défaut : en quinconce les points se touchent plus tôt (noir plein dès ~115 %, ~140 % en carré).
function dotsMaxDefault() { ui.wmax.set($('layout').value === 'hex' ? 100 : 120); }
$('layout').addEventListener('change', () => { dotsMaxDefault(); schedule(); });

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
  sliderRefresh.forEach(f => f());
  $('layoutRow').hidden = style !== 'dots';
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  if (typeof updateStats === 'function') updateStats();
}
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l; try { localStorage.setItem('stria-lang', lang); } catch (e) {}
  applyLang();
}));
['invert', 'auto', 'phys'].forEach(id => $(id).addEventListener('change', schedule));
$('file').addEventListener('change', e => loadFile(e.target.files[0]));
const main = $('main');
main.addEventListener('dragover', e => { e.preventDefault(); main.classList.add('over'); });
main.addEventListener('dragleave', () => main.classList.remove('over'));
main.addEventListener('drop', e => { e.preventDefault(); main.classList.remove('over'); loadFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => { const f = [...e.clipboardData.files].find(f => f.type.startsWith('image/')); if (f) loadFile(f); });

/* ====================== Calcul + rendu ====================== */

const EMPTY = new Float32Array(0);
let art = { polys: [], circles: EMPTY };

// Calcule la trame selon le style choisi : rubans (lignes, hachures) et/ou disques (points).
function generate(cov) {
  const p = ui.spacing.get(), pct = k => ui[k].get() / 100;
  const common = { spacing: p, angle: ui.angle.get(), step: Math.max(0.75, p / 4), smooth: 1.5, tol: Math.max(0.03, p * 0.015) };
  switch (style) {
    case 'dots':
      return { polys: [], circles: buildDots(cov, W, H, { spacing: p, angle: ui.angle.get(), layout: $('layout').value,
        dmin: p * pct('wmin'), dmax: p * pct('wmax'), cut: p * pct('cut') }) };
    case 'stochastic':
      return { polys: [], circles: stochasticDots(cov, W, H, { dot: ui.dot.get(), cut: pct('cut'), seed: ui.seed.get() }) };
    case 'hatch':
      return { polys: buildHatch(cov, W, H, { ...common, passes: ui.passes.get(), amax: pct('wmax'), cut: p * pct('cut') }), circles: EMPTY };
    default:
      return { polys: buildRibbons(cov, W, H, { ...common, wmin: p * pct('wmin'), wmax: p * pct('wmax'), cut: p * pct('cut') }), circles: EMPTY };
  }
}

function coverageMap() {
  const c = ui.contrast.get(), b = ui.bright.get(), g = ui.gamma.get();
  const auto = $('auto').checked, inv = $('invert').checked, phys = $('phys').checked;
  const cov = new Float32Array(W * H), span = hi - lo;
  for (let i = 0; i < cov.length; i++) {
    let L = baseGray[i];
    if (auto) L = (L - lo) / span;
    L = clamp((L - 0.5) * c + 0.5 + b, 0, 1);
    if (inv) L = 1 - L;
    const Y = phys ? Math.pow(L, 2.2) : L;               // réflectance linéaire
    cov[i] = Math.pow(1 - Y, g);
  }
  const unit = style === 'stochastic' ? ui.dot.get() * 3 : ui.spacing.get();   // échelle du motif
  return gaussBlur(cov, W, H, ui.detail.get() / 100 * unit);
}

const canvas = $('stage');
function drawArt(ctx, scale) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W * scale, H * scale);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const path = new Path2D();
  for (const { pts } of art.polys) {
    path.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) path.lineTo(pts[i], pts[i + 1]);
    path.closePath();
  }
  const c = art.circles;
  for (let i = 0; i < c.length; i += 3) { path.moveTo(c[i] + c[i + 2], c[i + 1]); path.arc(c[i], c[i + 1], c[i + 2], 0, 2 * Math.PI); }
  ctx.fillStyle = '#000'; ctx.fill(path, 'nonzero');
}

let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(render); } }

function render() {
  pending = false;
  if (!baseGray) return;
  const t0 = performance.now();
  art = generate(coverageMap());
  const sc = Math.min(1, 2000 / Math.max(W, H)) * Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * sc); canvas.height = Math.round(H * sc);
  drawArt(canvas.getContext('2d'), sc);
  const bw = main.clientWidth - 40, bh = main.clientHeight - 40, f = Math.min(bw / W, bh / H);
  canvas.style.width = Math.round(W * f) + 'px'; canvas.style.height = Math.round(H * f) + 'px';
  const far = ui.far.get();
  canvas.style.filter = far > 0 ? `blur(${far}px)` : 'none';
  lastMs = Math.round(performance.now() - t0);
  updateStats();
}
let lastMs = 0;
const hasArt = () => art.polys.length > 0 || art.circles.length > 0;
function updateStats() {
  if (!baseGray) return;
  let n;
  if (art.circles.length) n = `${art.circles.length / 3} ${T('dotsn')}`;
  else { let np = 0; for (const r of art.polys) np += r.pts.length / 2; n = `${art.polys.length} ${T('ribbons')} · ${np} ${T('vertices')}`; }
  $('stats').textContent = `${W}×${H} px · ${n} · ${lastMs} ms`;
}
window.addEventListener('resize', schedule);

/* ====================== Exports ====================== */

const fmt = v => { const s = v.toFixed(2); return s.replace(/\.?0+$/, ''); };

function buildSVG() {
  const mm = +$('svgmm').value;
  const wAttr = mm > 0 ? mm + 'mm' : W, hAttr = mm > 0 ? fmt(mm * H / W) + 'mm' : H;
  const parts = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${wAttr}" height="${hAttr}">`,
    `<rect width="${W}" height="${H}" fill="#fff"/>`,
    `<clipPath id="c"><rect width="${W}" height="${H}"/></clipPath>`,
    `<g fill="#000" clip-path="url(#c)">`];
  for (const { pts } of art.polys) {
    let d = 'M' + fmt(pts[0]) + ' ' + fmt(pts[1]);
    for (let i = 2; i < pts.length; i += 2) d += 'L' + fmt(pts[i]) + ' ' + fmt(pts[i + 1]);
    parts.push(`<path d="${d}Z"/>`);
  }
  const c = art.circles;
  for (let i = 0; i < c.length; i += 3) parts.push(`<circle cx="${fmt(c[i])}" cy="${fmt(c[i + 1])}" r="${fmt(c[i + 2])}"/>`);
  parts.push('</g></svg>');
  return parts.join('\n');
}

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('bsvg').addEventListener('click', () => { if (hasArt()) download(new Blob([buildSVG()], { type: 'image/svg+xml' }), 'stria.svg'); });
$('bpng').addEventListener('click', () => {
  if (!hasArt()) return;
  const sc = Math.min(ui.scale.get(), 12000 / Math.max(W, H));
  const c = document.createElement('canvas'); c.width = Math.round(W * sc); c.height = Math.round(H * sc);
  drawArt(c.getContext('2d'), sc);
  c.toBlob(b => download(b, 'stria.png'), 'image/png');
});

/* ====================== Auto-test (?test) ====================== */

function selfTest() {
  const w = 400, h = 300, cov = new Float32Array(w * h).fill(0.5);
  const res = [];
  for (const angle of [0, 45, 90, 33]) {
    const P = { spacing: 10, angle, wmin: 1, wmax: 9, cut: 0, step: 2.5, smooth: 1.5, tol: 0.15 };
    const rs = buildRibbons(cov, w, h, P), th = angle * Math.PI / 180, nx = -Math.sin(th), ny = Math.cos(th);
    const mids = rs.map(r => { let mn = 1e9, mx = -1e9;
      for (let i = 0; i < r.pts.length; i += 2) { const v = (r.pts[i] - w / 2) * nx + (r.pts[i + 1] - h / 2) * ny; mn = Math.min(mn, v); mx = Math.max(mx, v); }
      return { k: r.k, m: (mn + mx) / 2, th: mx - mn }; }).filter(o => o.th > 4.9 && o.th < 5.1);
    // épaisseur 5 constante → milieu doit être k·p ; sinon bords clippés, on ignore ceux non conformes
    const err = Math.max(...mids.map(o => Math.abs(o.m - o.k * 10)));
    res.push({ angle, ribbons: rs.length, checked: mids.length, maxAxisErr: +err.toFixed(4) });
  }
  // profil w ∈ [wmin,wmax] et pas de saut brusque sur dégradé
  const g = new Float32Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) g[y * w + x] = x / (w - 1);
  const rs = buildRibbons(g, w, h, { spacing: 10, angle: 0, wmin: 1, wmax: 9, cut: 0, step: 2.5, smooth: 1.5, tol: 0.05 });
  let wMin = 1e9, wMax = -1e9;
  for (const r of rs) { const m = r.pts.length / 4; for (let q = 0; q < m; q++) {
    const t = Math.abs(r.pts[2 * q + 1] - r.pts[2 * (2 * m - 1 - q) + 1]); wMin = Math.min(wMin, t); wMax = Math.max(wMax, t); } }
  res.push({ gradientWidthRange: [+wMin.toFixed(2), +wMax.toFixed(2)] });
  console.log('STRIA SELFTEST', JSON.stringify(res));
  return res;
}
window.stria = { sampleBilinear, gaussBlur, smooth1D, simplifyProfile, buildRibbons, buildDots, stochasticDots, buildHatch, selfTest };

applyLang();
setImageFromCanvas(demoImage());
// Paramètres d'URL (liens de démonstration, captures du README) : ?style=dots|stochastic|hatch&layout=hex
{
  const q = new URLSearchParams(location.search);
  if (q.get('layout') === 'hex') $('layout').value = 'hex';
  if (STYLE_DEFAULTS[q.get('style')]) { $('style').value = q.get('style'); $('style').dispatchEvent(new Event('change')); }
}
if (location.search.includes('test')) selfTest();
